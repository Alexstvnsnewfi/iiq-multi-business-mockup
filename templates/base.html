<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}IIQ Test{% endblock %}</title>
  {% if config.USE_TAILWIND_CDN %}
  <script src="https://cdn.tailwindcss.com"></script>
  {% else %}
  <link rel="stylesheet" href="{{ url_for('static', filename='tailwind.css') }}">
  {% endif %}
  <style>:root { font-family: Inter, system-ui, Avenir, Helvetica, Arial, sans-serif; }</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
